name: CI

# pull_request gates the review loop. push-to-main is not redundant: Railway's
# "Wait for CI" waits on checks for the commit it is about to deploy, and that
# commit is on main — without this trigger, enabling that setting would hang
# every deploy on a check that never reports. See ADR 0004 step 4.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from package.json's packageManager field, so CI
      # and local run the same pnpm. Must precede setup-node for its cache key.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails rather than silently resolving a drifted
      # lockfile, which is the whole point of running this away from the
      # machine that wrote it.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
